# HAL Serialization Profile for MFR

mfr:
  version: 1
  serialization:
    # Core serialization types
    - manufacturer
    - modelName
    - description
    - serialNumber
    - hardwareVersion
    - softwareVersion

    # Operator serialization types
    - manufacturerOui
    - hdmiHdcp
    - bluetoothMac
    - wpsPin
    - manufacturingSerialNumber
    - ethernetMac
    - estbMac
    - modelNumber
    - socId
    - blVersion
    - ledWhiteLevel
    - ledPattern

    # Panel serialization types
    - factoryBoot
    - countryCode
    - languageCode
    - manufacturerData
    - cpdSize
    - panelId
    - panelType

    # Vendor serialization types
    - vendorModelName
    - vendorSerialPrefix
